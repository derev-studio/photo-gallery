name: Add realtime analytics

on:
  push:
    paths:
      - '.github/workflows/add-realtime-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix realtime analytics startup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site-analytics.html')
          s = p.read_text(encoding='utf-8')
          old = "localStorage.setItem('derev_owner_browser_v1','1');await loadAnalytics()}catch(e){loginMsg.textContent=e.message}});"
          new = "localStorage.setItem('derev_owner_browser_v1','1');await loadAnalytics();await loadRealtime();setInterval(loadRealtime,15000)}catch(e){loginMsg.textContent=e.message}});"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Realtime startup fixed')
          else:
              print('Realtime startup already fixed or marker changed')
          PY
      - name: Commit changes
        run: |
          git config user.name "derev-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-analytics.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Start realtime analytics automatically"
            git push
          fi
