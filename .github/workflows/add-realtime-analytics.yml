name: Add realtime analytics

on:
  push:
    paths:
      - '.github/workflows/add-realtime-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch realtime worker
        env:
          FN_B64: 
        run: |
          printf '%s' "$FN_B64" | base64 --decode > /tmp/realtime.js
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker-qwen.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function handleRealtime(body, env, cors) {')
          end=s.index('\nasync function handleAnalytics(body, env, cors) {', start)
          fn=Path('/tmp/realtime.js').read_text(encoding='utf-8')
          p.write_text(s[:start]+fn+s[end:], encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "derev-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-worker-qwen.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix realtime GA4 site matching"
            git push
          fi
