name: Inject visitor tracker

on:
  push:
    paths:
      - '.github/workflows/inject-visitor-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject analytics-client.js into public HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          skip = {'analytics.html','admin.html','cleanup-firebase.html'}
          changed = []
          for p in Path('.').glob('*.html'):
              if p.name in skip:
                  continue
              s = p.read_text(encoding='utf-8')
              if 'analytics-client.js' in s:
                  continue
              tag = '<script src="analytics-client.js"></script>\n'
              if '</head>' in s:
                  s = s.replace('</head>', tag + '</head>', 1)
              else:
                  continue
              p.write_text(s, encoding='utf-8')
              changed.append(p.name)
          print('Updated tracker:', ', '.join(changed) if changed else 'nothing')
          PY

      - name: Restore Cloudinary image storage in main gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('            let finalUrl = uploadedDataUrl;')
          end_marker = '            const photo = {'
          end = s.find(end_marker, start)
          if start == -1:
              print('Old ImgBB block already replaced or not found')
          elif end == -1:
              raise SystemExit('Could not locate photo object after upload block')
          else:
              new = '''            let finalUrl = '';
            if (!selectedFile) {
                alert('Сначала выберите фотографию.');
                btn.disabled = false;
                btn.textContent = '🏛️ Разместить в галерею';
                return;
            }
            try {
                btn.textContent = '☁️ Загружаю фото в хранилище...';
                const fd = new FormData();
                fd.append('file', selectedFile);
                fd.append('upload_preset', 'kaktus');
                const res = await fetch('https://api.cloudinary.com/v1_1/i1lysqxk/image/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok || !data.secure_url) throw new Error((data.error && data.error.message) || 'Cloudinary не вернул ссылку');
                finalUrl = data.secure_url;
                btn.textContent = '🔥 Сохраняю в галерее...';
            } catch (e) {
                console.error('Cloudinary upload error:', e);
                alert('Фото не удалось загрузить в хранилище. В Firebase тяжёлый файл не отправляю. Попробуйте ещё раз.');
                btn.disabled = false;
                btn.textContent = '🏛️ Разместить в галерею';
                return;
            }

'''
              s = s[:start] + new + s[end:]
              p.write_text(s, encoding='utf-8')
              print('Cloudinary storage restored in index.html')
          PY

      - name: Commit changes
        run: |
          git config user.name "derev-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore Cloudinary storage and keep visitor tracking"
            git push
          fi
