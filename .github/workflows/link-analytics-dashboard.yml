name: Link Analytics Dashboard
on:
  push:
    paths:
      - '.github/workflows/link-analytics-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add analytics dashboard link to admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          if 'analytics.html' not in s:
              marker='<a class="btn gold" href="https://tagmanager.google.com/" target="_blank">Менеджер тегов</a>'
              add=marker+'<a class="btn green" href="analytics.html">📊 Открыть живую аналитику</a>'
              s=s.replace(marker,add,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Link live analytics dashboard from admin"
          git push
