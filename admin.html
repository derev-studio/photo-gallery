<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derev Studio — Админка</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:18px 22px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}.wrap{max-width:1280px;margin:auto;padding:20px}.login{max-width:560px;margin:70px auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.12);text-align:center}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #d6dde6;border-radius:20px;padding:17px;box-shadow:0 9px 25px rgba(0,0,0,.07)}.card h2{font-size:18px;margin:0 0 4px}.muted{color:#687386;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.stat{background:#f4f7fb;border:1px solid #e0e7ef;border-radius:13px;padding:10px}.stat b{display:block;font-size:22px;margin-top:2px}.label{font-size:11px;color:#6b7888;font-weight:800;text-transform:uppercase}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #c2cad5;border-radius:14px;padding:11px 15px;background:#fff;color:#18202b;font-weight:800;text-decoration:none;cursor:pointer}.btn.blue{background:#dff0ff;border-color:#78afe0}.btn.green{background:#eaf8ef;border-color:#a8d9b7}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{background:#fff7df;border:1px solid #ead79d;padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:13px}.good{background:#eaf8ef;border-color:#a8d9b7}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.section-title{font-size:20px;margin:0 0 12px}.account{font-size:13px;color:#536071}.ownerline{margin-top:8px;font-size:12px;color:#5e6877}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:11px;margin:2px 4px 2px 0}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><h1>🛠️ Derev Studio — админка</h1><div id="acct" class="account"></div></div><div class="wrap"><div id="loginBox" class="login"><h2>Вход владельца</h2><p class="muted">Статистика открывается только владельцу.</p><button id="loginBtn" class="btn blue">Войти через Google</button><div id="loginMsg" class="muted" style="margin-top:12px"></div></div><div id="dashboard" class="hidden"><div class="note good"><b>Теперь здесь нет фальшивых «20 заходов».</b> Показываем только данные GA4: пользователей и просмотры. Ваши заходы тоже учитываются; Ваш браузер помечен как владелец и не скрывается.</div><div class="toolbar"><button class="btn blue period" data-days="0">Сегодня</button><button class="btn blue period" data-days="7">7 дней</button><button class="btn blue period" data-days="30">30 дней</button><button id="reload" class="btn green">↻ Обновить</button><a class="btn" href="analytics.html">Подробная аналитика</a><span id="status" class="muted"></span></div><h2 class="section-title">🌐 Все сайты</h2><div id="sites" class="grid"></div></div></div><script>const cfg={apiKey:'AIzaSyB2X3o7KwYFkMfsskKoWpQYBrws8L-Mn9w',authDomain:'photo-gallery-18193.firebaseapp.com',projectId:'photo-gallery-18193',databaseURL:'https://photo-gallery-18193-default-rtdb.firebaseio.com',storageBucket:'photo-gallery-18193.firebasestorage.app',messagingSenderId:'329094770221',appId:'1:329094770221:web:b9d076f195f968668212a4'};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth();const worker='https://photo-ai-qwen.qerevv.workers.dev/';let days=7;const siteDefs=[['photo-gallery','Фотогалерея + AI'],['elki-palki','Ёлки-палки / кружки'],['dasha-risunki','Даша — рисунки'],['roni','Рони'],['toda-poriya','Toda Poriya'],['cow-site','Cow site'],['derevyashkin-writer','Сайт писателя'],['cactus-books','Книги / кактусы'],['photo-preview','Photo Preview'],['scanner','Scanner'],['pult','Pult']];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)}function siteFromPath(p){const m=String(p||'').match(/^\/([^\/]+)\//);return m?m[1]:''}function sumViews(pages,id){return (pages||[]).reduce((a,r)=>a+(siteFromPath(r.path)===id?(Number(r.views)||0):0),0)}function usersForSite(rows,id){for(const r of rows||[]){const key=String(r.name||r.site||r.path||'').toLowerCase();if(key===id||key.includes('/'+id+'/')||key.endsWith('/'+id)||key.includes(id))return Number(r.users)||0}return null}function renderCards(j){const pages=j.pages||[],siteRows=j.sites||[];document.getElementById('sites').innerHTML=siteDefs.map(([id,title])=>{const u=usersForSite(siteRows,id),v=sumViews(pages,id);const uText=u===null?'—':n(u);return `<div class="card"><h2>${esc(title)}</h2><div class="muted">${esc(id)}</div><div class="stats"><div class="stat"><span class="label">Пользователи</span><b>${uText}</b></div><div class="stat"><span class="label">Просмотры</span><b>${n(v)}</b></div></div><div class="ownerline">Период: ${days===0?'сегодня':days+' дней'}. Владелец считается тоже.</div><div class="actions" style="margin-top:12px"><a class="btn blue" target="_blank" href="https://derev-studio.github.io/${encodeURIComponent(id)}/">Открыть сайт</a><a class="btn" href="analytics.html">Кто заходил</a></div></div>`}).join('')}async function load(){status.textContent='Загружаю реальные данные…';try{const u=auth.currentUser;if(!u)throw new Error('Нет входа');const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'analytics',days})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка Analytics');renderCards(j);status.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Ошибка: '+e.message}}loginBtn.onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>loginMsg.textContent=e.message);auth.onAuthStateChanged(async u=>{if(!u)return;try{const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'whoami'})});const j=await r.json();if(!r.ok||!j.isOwner){loginMsg.textContent='Этот аккаунт не имеет доступа.';return}localStorage.setItem('derev_owner_browser_v1','1');loginBox.classList.add('hidden');dashboard.classList.remove('hidden');acct.textContent=(j.name||j.email||u.email||'Владелец')+' · владелец';await load()}catch(e){loginMsg.textContent='Не удалось проверить доступ: '+e.message}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);load()});reload.onclick=load;</script></body></html>
