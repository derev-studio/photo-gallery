<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Derev Studio — Админка</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="analytics-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:16px 22px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}.wrap{max-width:1500px;margin:auto;padding:20px}.login{max-width:560px;margin:70px auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.12);text-align:center}.hidden{display:none}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #c2cad5;border-radius:12px;padding:10px 14px;background:#fff;color:#18202b;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}.blue{background:#dff0ff;border-color:#78afe0}.green{background:#eaf8ef;border-color:#a8d9b7}.orange{background:#fff3df;border-color:#e4bd78}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.muted{color:#687386;font-size:13px}.note{background:#eaf8ef;border:1px solid #a8d9b7;padding:11px 13px;border-radius:13px;margin-bottom:16px;font-size:13px}.site-list{display:flex;flex-direction:column;gap:10px}.site-row{display:grid;grid-template-columns:minmax(220px,1.15fr) minmax(500px,2.8fr) auto;gap:16px;align-items:center;background:#fff;border:1px solid #d6dde6;border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.05)}.service{border-left:5px solid #e4bd78}.site-name h2{font-size:18px;margin:0 0 3px}.site-id{font-size:12px;color:#788493}.metrics{display:grid;grid-template-columns:repeat(4,minmax(105px,1fr));gap:8px}.metric{background:#f5f8fb;border:1px solid #e1e7ee;border-radius:11px;padding:9px 11px}.metric span{display:block;font-size:10px;text-transform:uppercase;color:#6b7888;font-weight:800}.metric b{display:block;font-size:21px;margin-top:2px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}@media(max-width:1050px){.site-row{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.actions{justify-content:flex-start}}@media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="top"><h1>Мои сайты</h1><div id="acct" class="muted"></div></div>
<div class="wrap">
<div id="loginBox" class="login"><h2>Вход владельца</h2><p class="muted">Статистика доступна только владельцу.</p><button id="loginBtn" class="btn blue">Войти через Google</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div>
<div id="dashboard" class="hidden">
<div class="toolbar"><button class="btn period" data-days="0">Сегодня</button><button class="btn period blue" data-days="7">7 дней</button><button class="btn period" data-days="30">30 дней</button><button id="reload" class="btn green">↻ Обновить</button><span id="status" class="muted"></span></div>
<div id="sites" class="site-list"></div>
</div>
</div>
<script>
const cfg={apiKey:'AIzaSyB2X3o7KwYFkMfsskKoWpQYBrws8L-Mn9w',authDomain:'photo-gallery-18193.firebaseapp.com',projectId:'photo-gallery-18193',databaseURL:'https://photo-gallery-18193-default-rtdb.firebaseio.com',storageBucket:'photo-gallery-18193.firebasestorage.app',messagingSenderId:'329094770221',appId:'1:329094770221:web:b9d076f195f968668212a4'};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),worker='https://photo-ai-qwen.qerevv.workers.dev/';
let days=7;
const defs=[
{id:'empire',title:'Империя Александра Деревяшкина',url:'https://derev-studio.github.io/'},
{id:'photo-gallery',title:'Фотогалерея + AI',url:'https://derev-studio.github.io/photo-gallery/'},
{id:'derevyashkin-writer',title:'Сайт писателя',url:'https://derev-studio.github.io/derevyashkin-writer/'},
{id:'elki-palki',title:'Ёлки-палки / кружки',url:'https://derev-studio.github.io/elki-palki/'},
{id:'cactus-books',title:'Книги / кактусы',url:'https://derev-studio.github.io/cactus-books/'},
{id:'cow-site',title:'Cow site',url:'https://derev-studio.github.io/cow-site/'},
{id:'irina-photo',title:'Ирина — фото',url:'https://irina-photo.github.io/'},
{id:'dasha-risunki',title:'Даша — рисунки',url:'https://derev-studio.github.io/dasha-risunki/'},
{id:'roni',title:'Рони',url:'https://derev-studio.github.io/roni/'},
{id:'toda-poriya',title:'Toda Poriya',url:'https://derev-studio.github.io/toda-poriya/'},
{id:'photo-preview',title:'Photo Preview',url:'https://derev-studio.github.io/photo-preview/'},
{id:'scanner',title:'Scanner',url:'https://derev-studio.github.io/scanner/'},
{id:'pult',title:'Pult',url:'https://derev-studio.github.io/pult/'}
];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function n(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)}
function firstPart(p){const a=String(p||'').split('?')[0].split('/').filter(Boolean);return a[0]||''}
function ownsPage(id,p){const path=String(p||'').split('?')[0].toLowerCase();if(id==='admin')return path.endsWith('/admin.html')||path==='admin.html';if(id==='site-analytics')return path.endsWith('/site-analytics.html')||path==='site-analytics.html';if(id==='analytics')return path.endsWith('/analytics.html')||path==='analytics.html';const part=firstPart(path);return id==='empire'?(part===''||part==='empire'):part===id}
function siteViews(j,d){const sr=rowFor(j.sites||[],d.id,d.title);if(sr&&Number.isFinite(Number(sr.views)))return Number(sr.views)||0;const pr=(j.pages||[]).filter(r=>ownsPage(d.id,r.path));return pr.reduce((a,r)=>a+(Number(r.views)||0),0)}
function rowFor(rows,id,title){return(rows||[]).find(r=>{const v=String(r.name||'').toLowerCase();return v===id.toLowerCase()||v===title.toLowerCase()||v.includes(id.toLowerCase())||(id==='empire'&&(v==='root'||v.includes('root')))})}
function render(j){const pages=j.pages||[],siteRows=j.sites||[];sites.innerHTML=defs.map(d=>{const pr=pages.filter(r=>ownsPage(d.id,r.path));const sr=rowFor(siteRows,d.id,d.title);const views=(d.id==='irina-photo'&&sr&&Number.isFinite(Number(sr.views)))?(Number(sr.views)||0):pr.reduce((a,r)=>a+(Number(r.views)||0),0);const uniquePages=(d.id==='irina-photo'&&sr&&Number.isFinite(Number(sr.pages)))?(Number(sr.pages)||0):new Set(pr.map(r=>String(r.path||'/').split('?')[0])).size;const users=sr?Number(sr.users)||0:null;return `<div class="site-row ${d.service?'service':''}"><div class="site-name"><h2><a href="${d.url}" style="color:inherit;text-decoration:none">${esc(d.title)}</a></h2><div class="site-id">${esc(d.id)}${d.service?' · служебная страница':''}</div></div><div class="metrics"><div class="metric"><span>Пользователи</span><b>${users===null?'—':n(users)}</b></div><div class="metric"><span>Просмотры</span><b>${n(views)}</b></div><div class="metric"><span>Страниц с визитами</span><b>${n(uniquePages)}</b></div><div class="metric"><span>Период</span><b>${days===0?'Сегодня':days+' дн.'}</b></div></div><div class="actions"><a class="btn blue" target="_blank" rel="noopener" href="${d.url}">Сайт</a><a class="btn green" target="_blank" rel="noopener" href="site-analytics.html?site=${encodeURIComponent(d.id)}">Статистика</a></div></div>`}).join('')}
async function load(){status.textContent='Загружаю…';try{const u=auth.currentUser;if(!u)return;const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'analytics',days})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка Analytics');render(j);status.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Ошибка: '+e.message}}
loginBtn.onclick=async()=>{loginMsg.textContent='';try{await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())}catch(e){loginMsg.textContent=e.message}};
auth.onAuthStateChanged(async u=>{if(!u)return;try{const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'whoami'})});const j=await r.json();if(!r.ok||!j.isOwner){loginMsg.textContent='Нет доступа';return}localStorage.setItem('derev_owner_browser_v1','1');loginBox.classList.add('hidden');dashboard.classList.remove('hidden');acct.textContent=(j.name||j.email||u.email||'Владелец')+' · владелец';load()}catch(e){loginMsg.textContent=e.message}});
document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{document.querySelectorAll('.period').forEach(x=>x.classList.remove('blue'));b.classList.add('blue');days=Number(b.dataset.days);load()});reload.onclick=load;
</script>
</body>
</html>
