<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derev Studio — Админка</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:16px 22px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}.wrap{max-width:1500px;margin:auto;padding:20px}.login{max-width:560px;margin:70px auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 16px 45px rgba(0,0,0,.12);text-align:center}.hidden{display:none}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #c2cad5;border-radius:12px;padding:10px 14px;background:#fff;color:#18202b;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}.blue{background:#dff0ff;border-color:#78afe0}.green{background:#eaf8ef;border-color:#a8d9b7}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.muted{color:#687386;font-size:13px}.note{background:#eaf8ef;border:1px solid #a8d9b7;padding:11px 13px;border-radius:13px;margin-bottom:16px;font-size:13px}.site-list{display:flex;flex-direction:column;gap:10px}.site-row{display:grid;grid-template-columns:minmax(220px,1.15fr) minmax(500px,2.8fr) auto;gap:16px;align-items:center;background:#fff;border:1px solid #d6dde6;border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.05)}.site-name h2{font-size:18px;margin:0 0 3px}.site-id{font-size:12px;color:#788493}.metrics{display:grid;grid-template-columns:repeat(4,minmax(105px,1fr));gap:8px}.metric{background:#f5f8fb;border:1px solid #e1e7ee;border-radius:11px;padding:9px 11px}.metric span{display:block;font-size:10px;text-transform:uppercase;color:#6b7888;font-weight:800}.metric b{display:block;font-size:21px;margin-top:2px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}@media(max-width:1050px){.site-row{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.actions{justify-content:flex-start}}@media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}.wrap{padding:12px}}</style></head><body><div class="top"><h1>🛠️ Derev Studio — аналитика сайтов</h1><div id="acct" class="muted"></div></div><div class="wrap"><div id="loginBox" class="login"><h2>Вход владельца</h2><p class="muted">Статистика доступна только владельцу.</p><button id="loginBtn" class="btn blue">Войти через Google</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div><div id="dashboard" class="hidden"><div class="note">«Империя» теперь подключена к аналитике точно так же, как Фотогалерея и остальные сайты.</div><div class="toolbar"><button class="btn period" data-days="0">Сегодня</button><button class="btn period blue" data-days="7">7 дней</button><button class="btn period" data-days="30">30 дней</button><button id="reload" class="btn green">↻ Обновить</button><a class="btn" href="analytics.html">Общая аналитика</a><span id="status" class="muted"></span></div><div id="sites" class="site-list"></div></div></div><script>const cfg={apiKey:'AIzaSyB2X3o7KwYFkMfsskKoWpQYBrws8L-Mn9w',authDomain:'photo-gallery-18193.firebaseapp.com',projectId:'photo-gallery-18193',databaseURL:'https://photo-gallery-18193-default-rtdb.firebaseio.com',storageBucket:'photo-gallery-18193.firebasestorage.app',messagingSenderId:'329094770221',appId:'1:329094770221:web:b9d076f195f968668212a4'};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),worker='https://photo-ai-qwen.qerevv.workers.dev/';let days=7;const defs=[['empire','Империя Александра Деревяшкина'],['photo-gallery','Фотогалерея + AI'],['derevyashkin-writer','Сайт писателя'],['elki-palki','Ёлки-палки / кружки'],['cactus-books','Книги / кактусы'],['cow-site','Cow site'],['dasha-risunki','Даша — рисунки'],['roni','Рони'],['toda-poriya','Toda Poriya'],['photo-preview','Photo Preview'],['scanner','Scanner'],['pult','Pult']];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)}function firstPart(p){const a=String(p||'').split('/').filter(Boolean);return a[0]||''}function rowFor(rows,id,title){return(rows||[]).find(r=>{const v=String(r.name||'').toLowerCase();return v===id.toLowerCase()||v===title.toLowerCase()||v.includes(id.toLowerCase())})}function render(j){const pages=j.pages||[],siteRows=j.sites||[];sites.innerHTML=defs.map(([id,title])=>{const pr=pages.filter(r=>firstPart(r.path)===id);const views=pr.reduce((a,r)=>a+(Number(r.views)||0),0),sr=rowFor(siteRows,id,title),users=sr?Number(sr.users)||0:null,url=id==='empire'?'https://derev-studio.github.io/':'https://derev-studio.github.io/'+id+'/';return `<div class="site-row"><div class="site-name"><h2>${esc(title)}</h2><div class="site-id">${esc(id)}</div></div><div class="metrics"><div class="metric"><span>Пользователи</span><b>${users===null?'—':n(users)}</b></div><div class="metric"><span>Просмотры</span><b>${n(views)}</b></div><div class="metric"><span>Страниц с визитами</span><b>${n(pr.length)}</b></div><div class="metric"><span>Период</span><b>${days===0?'Сегодня':days+' дн.'}</b></div></div><div class="actions"><a class="btn blue" target="_blank" rel="noopener" href="${url}">Открыть сайт</a><a class="btn green" href="site-analytics.html?site=${encodeURIComponent(id)}">Аналитика сайта</a></div></div>`}).join('')}async function load(){status.textContent='Загружаю…';try{const u=auth.currentUser;if(!u)return;const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'analytics',days})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка Analytics');render(j);status.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Ошибка: '+e.message}}loginBtn.onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>loginMsg.textContent=e.message);auth.onAuthStateChanged(async u=>{if(!u)return;try{const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'whoami'})});const j=await r.json();if(!r.ok||!j.isOwner){loginMsg.textContent='Нет доступа';return}localStorage.setItem('derev_owner_browser_v1','1');loginBox.classList.add('hidden');dashboard.classList.remove('hidden');acct.textContent=(j.name||j.email||u.email||'Владелец')+' · владелец';load()}catch(e){loginMsg.textContent=e.message}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{document.querySelectorAll('.period').forEach(x=>x.classList.remove('blue'));b.classList.add('blue');days=Number(b.dataset.days);load()});reload.onclick=load;</script></body></html>
