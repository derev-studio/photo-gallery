<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derev Studio — Админка</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:16px 22px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;z-index:20}.top h1{font-size:22px;margin:0}.wrap{max-width:1280px;margin:auto;padding:20px}.login{max-width:560px;margin:70px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.1);text-align:center}.hidden{display:none}.muted{color:#687386;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #c2cad5;border-radius:12px;padding:9px 13px;background:#fff;color:#18202b;font-weight:800;text-decoration:none;cursor:pointer}.btn.blue,.period.on{background:#dff0ff;border-color:#78afe0}.btn.green{background:#eaf8ef;border-color:#a8d9b7}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.note{background:#eaf8ef;border:1px solid #a8d9b7;padding:11px 13px;border-radius:13px;margin-bottom:15px;font-size:13px}.site-list{display:flex;flex-direction:column;gap:9px}.site-row{background:#fff;border:1px solid #d6dde6;border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(260px,1fr) auto;gap:18px;align-items:center;box-shadow:0 5px 16px rgba(0,0,0,.05)}.site-name{font-size:17px;font-weight:900}.site-id{font-size:12px;color:#738092;margin-top:3px}.metrics{display:flex;gap:22px;align-items:center}.metric{min-width:95px}.metric .label{font-size:10px;color:#6b7888;font-weight:800;text-transform:uppercase}.metric .value{font-size:24px;font-weight:900;line-height:1.05;margin-top:2px}.actions{display:flex;justify-content:flex-end}.account{font-size:13px;color:#536071}.section-title{font-size:19px;margin:0 0 11px}@media(max-width:800px){.site-row{grid-template-columns:1fr}.metrics{gap:28px}.actions{justify-content:flex-start}}</style></head><body><div class="top"><h1>🛠️ Derev Studio — админка</h1><div id="acct" class="account"></div></div><div class="wrap"><div id="loginBox" class="login"><h2>Вход владельца</h2><p class="muted">Статистика открывается только владельцу.</p><button id="loginBtn" class="btn blue">Войти через Google</button><div id="loginMsg" class="muted" style="margin-top:12px"></div></div><div id="dashboard" class="hidden"><div class="note">Один сайт = одна строка. Слева название, рядом его реальные данные GA4, справа только переход на сайт. Ваши посещения тоже учитываются.</div><div class="toolbar"><button class="btn period" data-days="0">Сегодня</button><button class="btn period on" data-days="7">7 дней</button><button class="btn period" data-days="30">30 дней</button><button id="reload" class="btn green">↻ Обновить</button><a class="btn" href="analytics.html">Подробная общая аналитика</a><span id="status" class="muted"></span></div><h2 class="section-title">🌐 Все сайты</h2><div id="sites" class="site-list"></div></div></div><script>const cfg={apiKey:'AIzaSyB2X3o7KwYFkMfsskKoWpQYBrws8L-Mn9w',authDomain:'photo-gallery-18193.firebaseapp.com',projectId:'photo-gallery-18193',databaseURL:'https://photo-gallery-18193-default-rtdb.firebaseio.com',storageBucket:'photo-gallery-18193.firebasestorage.app',messagingSenderId:'329094770221',appId:'1:329094770221:web:b9d076f195f968668212a4'};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth();const worker='https://photo-ai-qwen.qerevv.workers.dev/';let days=7;const siteDefs=[['photo-gallery','Фотогалерея + AI'],['elki-palki','Ёлки-палки / кружки'],['dasha-risunki','Даша — рисунки'],['roni','Рони'],['toda-poriya','Toda Poriya'],['cow-site','Cow site'],['derevyashkin-writer','Сайт писателя'],['cactus-books','Книги / кактусы'],['photo-preview','Photo Preview'],['scanner','Scanner'],['pult','Pult']];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)}function siteFromPath(p){const m=String(p||'').match(/^\/([^\/]+)\//);return m?m[1]:''}function sumViews(pages,id){return (pages||[]).reduce((a,r)=>a+(siteFromPath(r.path)===id?(Number(r.views)||0):0),0)}function usersForSite(rows,id){for(const r of rows||[]){const key=String(r.name||r.site||r.path||'').toLowerCase();if(key===id||key.includes('/'+id+'/')||key.endsWith('/'+id)||key.includes(id))return Number(r.users)||0}return null}function renderRows(j){const pages=j.pages||[],siteRows=j.sites||[];sites.innerHTML=siteDefs.map(([id,title])=>{const u=usersForSite(siteRows,id),v=sumViews(pages,id);return `<div class="site-row"><div><div class="site-name">${esc(title)}</div><div class="site-id">${esc(id)}</div></div><div class="metrics"><div class="metric"><div class="label">Люди</div><div class="value">${u===null?'—':n(u)}</div></div><div class="metric"><div class="label">Просмотры</div><div class="value">${n(v)}</div></div></div><div class="actions"><a class="btn blue" target="_blank" href="https://derev-studio.github.io/${encodeURIComponent(id)}/">Открыть сайт</a></div></div>`}).join('')}async function load(){status.textContent='Загружаю…';try{const u=auth.currentUser;if(!u)throw new Error('Нет входа');const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'analytics',days})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка Analytics');renderRows(j);status.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Ошибка: '+e.message}}loginBtn.onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>loginMsg.textContent=e.message);auth.onAuthStateChanged(async u=>{if(!u)return;try{const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'whoami'})});const j=await r.json();if(!r.ok||!j.isOwner){loginMsg.textContent='Этот аккаунт не имеет доступа.';return}localStorage.setItem('derev_owner_browser_v1','1');loginBox.classList.add('hidden');dashboard.classList.remove('hidden');acct.textContent=(j.name||j.email||u.email||'Владелец')+' · владелец';await load()}catch(e){loginMsg.textContent='Не удалось проверить доступ: '+e.message}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{document.querySelectorAll('.period').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=Number(b.dataset.days);load()});reload.onclick=load;</script></body></html>
