<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Очистка Firebase</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#1e2530;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#fff;border:1px solid #dfe5ec;border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(0,0,0,.08)}h1{font-size:24px}button{font:inherit;border:1px solid #9fb7cf;border-radius:16px;padding:12px 18px;cursor:pointer;font-weight:800;color:#214568;background:linear-gradient(#fff,#dceeff);box-shadow:0 4px 0 #a8bdd1,0 8px 20px rgba(37,61,89,.14)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8bdd1}.ok{background:#e9fff1;border:1px solid #9fd1b1;border-radius:14px;padding:14px;margin:16px 0}.warn{background:#fff8e8;border:1px solid #ebd29a;border-radius:14px;padding:14px;margin:16px 0}.log{white-space:pre-wrap;background:#f7f9fc;border-radius:14px;padding:14px;min-height:90px}iframe{width:1px;height:1px;border:0;position:absolute;left:-10000px}</style></head><body><div class="box"><h1>🧹 Очистка Firebase</h1><div class="warn">Страница найдёт только тяжёлые картинки вида <b>data:image…</b> в «Моих работах», перенесёт их в ImgBB и в Firebase оставит только короткие ссылки. Общую галерею не трогает.</div><button id="run">Начать очистку</button><div id="log" class="log">Подготовка…</div></div><iframe id="worker" src="editor-ai.html"></iframe><script>const log=document.getElementById('log'),frame=document.getElementById('worker');const say=t=>log.textContent=t;async function waitReady(){for(let i=0;i<80;i++){try{const w=frame.contentWindow;if(w&&typeof w.personalRef==='function'&&typeof w.uploadPublic==='function'&&w.personalRef())return w}catch(e){}await new Promise(r=>setTimeout(r,250))}throw new Error('Не удалось открыть аккаунт. Сначала войдите через Google в редакторе.')}document.getElementById('run').onclick=async()=>{try{say('Ищу тяжёлые картинки…');const w=await waitReady();const ref=w.personalRef();const snap=await ref.once('value');const data=snap.val()||{};const items=Object.entries(data).filter(([,x])=>String(x&&x.url||'').startsWith('data:image/'));if(!items.length){say('Готово. Тяжёлых картинок в Firebase уже нет.');return}let done=0,failed=0;say('Найдено: '+items.length+'. Переношу в ImgBB…');for(const [key,x] of items){try{const url=await w.uploadPublic(x.url);if(!url||String(url).startsWith('data:'))throw new Error('не получена ссылка');await ref.child(key).update({url});done++;say('Перенесено '+done+' из '+items.length+'…')}catch(e){failed++}}say('Готово. Убрано из Firebase: '+done+'. Ошибок: '+failed+'. Теперь в Firebase остались только ссылки.')}catch(e){say('Ошибка: '+e.message)}};</script></body></html>
