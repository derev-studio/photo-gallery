<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика сайта — Derev Studio</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#16202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ccd6e2;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.wrap{max-width:1100px;margin:auto;padding:18px}.login,.panel,.card{background:#fff;border:1px solid #d7e0e9;border-radius:18px;box-shadow:0 8px 24px rgba(25,45,70,.06)}.login{max-width:520px;margin:60px auto;padding:26px;text-align:center}.hidden{display:none}.btn{border:1px solid #b8c6d6;border-radius:12px;padding:9px 13px;background:#fff;font-weight:800;color:#17212b;text-decoration:none;cursor:pointer;display:inline-flex}.blue,.on{background:#dff0ff;border-color:#78afe0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.status{font-size:13px;color:#667489}.note{padding:11px 13px;border-radius:13px;background:#eaf8ef;border:1px solid #a8d9b7;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{padding:15px;border-top:5px solid #4da3ff}.label{font-size:11px;color:#6b7888;font-weight:800;text-transform:uppercase}.metric{font-size:30px;font-weight:900;margin-top:5px}.panel{padding:16px;margin-top:14px}.panel h2{margin:0 0 12px;font-size:18px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}.num{text-align:right}.empty{padding:20px;color:#738092;text-align:center}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="top"><div><h2 id="pageTitle" style="margin:0">📊 Аналитика сайта</h2><div id="acct" class="status"></div></div><a class="btn" href="admin.html">← Админка</a></div>
<div class="wrap">
<div id="loginBox" class="login"><h2>Вход владельца</h2><p class="status">Статистика доступна только владельцу.</p><button id="loginBtn" class="btn blue">Войти через Google</button><div id="loginMsg" class="status" style="margin-top:10px"></div></div>
<div id="dash" class="hidden">
<div class="note" id="note">Данные Google Analytics по выбранному сайту. Твои заходы тоже учитываются.</div>
<div class="toolbar"><button class="btn period" data-days="0">Сегодня</button><button class="btn period on" data-days="7">7 дней</button><button class="btn period" data-days="30">30 дней</button><button id="refresh" class="btn blue">↻ Обновить</button><span id="status" class="status"></span></div>
<div class="cards"><div class="card"><div class="label">Посетители</div><div class="metric" id="users">—</div></div><div class="card"><div class="label">Просмотры</div><div class="metric" id="views">—</div></div><div class="card"><div class="label">Сеансы</div><div class="metric" id="sessions">—</div></div><div class="card"><div class="label">Новые</div><div class="metric" id="newUsers">—</div></div></div>
<div class="panel"><h2>📄 Страницы сайта</h2><div id="pages"></div></div>
<div class="panel"><h2>🌍 Подробная статистика</h2><div id="details" class="status">Загружаю…</div></div>
</div></div>
<script>
const cfg={apiKey:'AIzaSyB2X3o7KwYFkMfsskKoWpQYBrws8L-Mn9w',authDomain:'photo-gallery-18193.firebaseapp.com',projectId:'photo-gallery-18193',databaseURL:'https://photo-gallery-18193-default-rtdb.firebaseio.com',storageBucket:'photo-gallery-18193.firebasestorage.app',messagingSenderId:'329094770221',appId:'1:329094770221:web:b9d076f195f968668212a4'};
if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),worker='https://photo-ai-qwen.qerevv.workers.dev/';const site=new URLSearchParams(location.search).get('site')||'';let days=7;
const names={root:'Империя Александра Деревяшкина','photo-gallery':'Фотогалерея + AI','derevyashkin-writer':'Сайт писателя','elki-palki':'Ёлки-палки / кружки','cactus-books':'Книги / кактусы','cow-site':'Cow site','dasha-risunki':'Даша — рисунки',roni:'Рони','toda-poriya':'Toda Poriya','photo-preview':'Photo Preview',scanner:'Scanner',pult:'Pult'};pageTitle.textContent='📊 '+(names[site]||site||'Сайт')+' — аналитика';
function fmt(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)}function firstPart(p){const a=String(p||'').split('/').filter(Boolean);return a[0]||'root'}function isRootPage(path){const s=String(path||'');if(s==='/'||s==='')return true;const f=firstPart(s);const projects=['photo-gallery','derevyashkin-writer','elki-palki','cactus-books','cow-site','dasha-risunki','roni','toda-poriya','photo-preview','scanner','pult'];return !projects.includes(f)}function table(rows){if(!rows.length)return '<div class="empty">Пока нет данных</div>';return '<table><thead><tr><th>Страница</th><th class="num">Просмотры</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+String(r.path||'/').replace(/[&<>]/g,'')+'</td><td class="num">'+fmt(r.views)+'</td></tr>').join('')+'</tbody></table>'}
async function api(body){const u=auth.currentUser;if(!u)throw new Error('Нет входа');const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка аналитики');return j}
async function load(){status.textContent='Загружаю…';try{if(site==='root'){const j=await api({action:'analytics',days});const rootPages=(j.pages||[]).filter(r=>isRootPage(r.path));const rootViews=rootPages.reduce((a,r)=>a+(Number(r.views)||0),0);const sr=(j.sites||[]).find(r=>{const n=String(r.name||'').toLowerCase();return n==='root'||n.includes('импер')});users.textContent=sr?fmt(sr.users):'—';views.textContent=fmt(rootViews);sessions.textContent=sr&&sr.sessions!=null?fmt(sr.sessions):'—';newUsers.textContent=sr&&sr.newUsers!=null?fmt(sr.newUsers):'—';pages.innerHTML=table(rootPages);note.textContent='Империя считается как корневой сайт: главная, статьи, «Мыслящая Вселенная» и другие страницы в корне. Поэтому здесь теперь используются те же данные, что и в главной админке.';details.textContent='Посетители и просмотры Империи теперь показываются из общего отчёта без ошибочного фильтра root. География и устройства для Империи будут добавлены отдельно после доработки серверного фильтра.'}else{const j=await api({action:'analytics',days,site});const s=j.summary||{};users.textContent=fmt(s.users);views.textContent=fmt(s.views);sessions.textContent=fmt(s.sessions);newUsers.textContent=fmt(s.newUsers);pages.innerHTML=table(j.pages||[]);details.textContent='Подробная статистика по этому сайту загружена нормально.'}status.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.textContent='Ошибка: '+e.message;details.textContent=e.message}}
loginBtn.onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>loginMsg.textContent=e.message);auth.onAuthStateChanged(async u=>{if(!u)return;try{const token=await u.getIdToken();const r=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'whoami'})});const j=await r.json();if(!r.ok||!j.isOwner){loginMsg.textContent='Нет доступа';return}loginBox.classList.add('hidden');dash.classList.remove('hidden');acct.textContent=j.name||j.email||u.email||'Владелец';localStorage.setItem('derev_owner_browser_v1','1');load()}catch(e){loginMsg.textContent=e.message}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{document.querySelectorAll('.period').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=Number(b.dataset.days);load()});refresh.onclick=load;
</script></body></html>
